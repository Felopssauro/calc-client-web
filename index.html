<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Calculator</title>
	</head>
	<body>
		<main>
			<h1>Calculator</h1>
			<div>
				<label for="number-input-1">Enter a number:</label><br>
				<input type="tel" id="number-input-1" name="tel" />
			</div>

			<div>
				<label for="number-input-2">Enter a number:</label><br>
				<input type="tel" id="number-input-2" name="tel" />
			</div>
            <br>
			<div>
				<button type="button" id="add">Soma</button>
            </div>
            <br>
            <br>
            <div>
                <label id="result-label">Result: —</label>
            </div>
            <script>
                    async function sendData() {
                    const a = document.getElementById('number-input-1').value;
                    const b = document.getElementById('number-input-2').value;
                    try {
                        const res = await fetch('http://127.0.0.1:8000/calculator/add', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ a, b })
                        });
                        if (!res.ok) throw new Error(await res.text());
                        const json = await res.json();
                        document.getElementById('result-label').textContent = 'Result: ' + (json.result ?? JSON.stringify(json));
                        } catch (err) {
                            document.getElementById('result-label').textContent = 'Error: ' + err.message;
                        }
                    }
                    document.getElementById('add').addEventListener('click', sendData);
            </script>
		</main>
	</body>
</html>
